name: build-5.4.210-sigoff

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: clang-12
      LD: ld.lld-12
      AR: llvm-ar-12
      NM: llvm-nm-12
      STRIP: llvm-strip-12
      OBJCOPY: llvm-objcopy-12
      OBJDUMP: llvm-objdump-12
      READELF: llvm-readelf-12
      LLVM_IAS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (clang-12 + lld + binutils aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev python3 \
            clang-12 lld-12 llvm-12 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          clang-12 --version | head -1
          ld.lld-12 --version | head -1

      - name: Fix exec bit on kernel scripts
        run: |
          cd "$GITHUB_WORKSPACE"
          grep -rlI '^#!' scripts | xargs -r chmod +x
          chmod +x scripts/config scripts/mkcompile_h 2>/dev/null || true

      - name: Apply sig-off config
        run: |
          cd "$GITHUB_WORKSPACE"
          cp cfg-5.4.210-sigoff.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            olddefconfig
          echo "=== config efektif ==="
          grep -E '^(CONFIG_MODULE_SIG|CONFIG_KVM|CONFIG_CFI_CLANG|CONFIG_LTO|CONFIG_CLANG_VERSION|CONFIG_VIRTUALIZATION)' .config || true

      - name: Build Image (kernel 5.4.210 sig-off, KVM kept)
        run: |
          cd "$GITHUB_WORKSPACE"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            -j"$(nproc)" Image 2>&1 | tail -50

      - name: Build berry modules (bfkrt_ko, external)
        run: |
          cd "$GITHUB_WORKSPACE"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            -j"$(nproc)" M=bfkrt_ko modules 2>&1 | tail -40
          ls -la bfkrt_ko/*.ko || true

      - name: Upload kernel + modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.4.210-sigoff
          path: |
            arch/arm64/boot/Image
            bfkrt_ko/*.ko
            System.map
          if-no-files-found: error
