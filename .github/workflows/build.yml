name: build-5.4.210-sigoff

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: clang-12
      LD: ld.lld-12
      AR: llvm-ar-12
      NM: aarch64-linux-gnu-nm
      STRIP: llvm-strip-12
      OBJCOPY: llvm-objcopy-12
      OBJDUMP: llvm-objdump-12
      READELF: llvm-readelf-12
      LLVM_IAS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (clang-12 + lld + binutils aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev python3 \
            clang-12 lld-12 llvm-12 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          clang-12 --version | head -1
          ld.lld-12 --version | head -1

      - name: Fix exec bit on kernel scripts
        run: |
          cd "$GITHUB_WORKSPACE"
          grep -rlI '^#!' scripts | xargs -r chmod +x
          chmod +x scripts/config scripts/mkcompile_h 2>/dev/null || true

      - name: Apply sig-off config
        run: |
          cd "$GITHUB_WORKSPACE"
          cp cfg-5.4.210-sigoff.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=aarch64-linux-gnu-nm STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            olddefconfig
          echo "=== config efektif ==="
          grep -E '^(CONFIG_MODULE_SIG|CONFIG_KVM|CONFIG_CFI_CLANG|CONFIG_LTO|CONFIG_CLANG_VERSION|CONFIG_VIRTUALIZATION)' .config || true

      - name: Preflight (detect all missing sources at once)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=aarch64-linux-gnu-nm STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            -n Image > preflight.log 2>&1
          grep -iE 'No rule to make target' preflight.log | sed 's/.*No rule/No rule/' | sort -u | tee missing.txt
          N=$(wc -l < missing.txt)
          echo "MISS_COUNT=$N"
          if [ "$N" -gt 0 ]; then echo "FATAL: ada $N source hilang (lihat missing.txt)"; tail -60 preflight.log; exit 1; fi
          echo "PREFLIGHT_OK"

      - name: Prebuild vdso (generate include/generated/vdso-offsets.h)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          # signal.c butuh vdso_offset_sigtramp dari header hasil generate;
          # fresh checkout tidak punya, dan obj-y dikompilasi sebelum subdir-y vdso.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=aarch64-linux-gnu-nm STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            -j1 arch/arm64/kernel/vdso/vdso.so.dbg > build_vdso.log 2>&1
          RC=$?
          echo "VDSO_RC=$RC"
          tail -20 build_vdso.log
          echo "--- vdso-offsets.h ---"
          cat include/generated/vdso-offsets.h 2>&1 || true
          if [ ! -s include/generated/vdso-offsets.h ]; then echo "FATAL: header vdso tidak ter-generate"; exit 1; fi

      - name: Build Image (kernel 5.4.210 sig-off, KVM kept)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          # -j1: clang-12 LTO full + CFI butuh RAM besar; hindari OOM di runner 7GB.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=aarch64-linux-gnu-nm STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            -j1 Image > build_img.log 2>&1
          RC=$?
          echo "IMG_RC=$RC"
          tail -60 build_img.log
          ls -la arch/arm64/boot/Image vmlinux Module.symvers 2>&1 || true
          if [ ! -f arch/arm64/boot/Image ]; then echo "FATAL: no Image (RC=$RC)"; tail -140 build_img.log; exit 1; fi
          echo "=== verifikasi vdso ==="
          aarch64-linux-gnu-nm arch/arm64/kernel/vdso/vdso.so.dbg 2>/dev/null | grep -i 'VDSO_sigtramp' || echo "WARN: VDSO_sigtramp tidak di vdso.so.dbg (pakai fallback asm/vdso.h)"
          echo "--- vdso-offsets.h setelah build ---"
          cat include/generated/vdso-offsets.h 2>&1 || true

      - name: Build berry modules (bfkrt_ko, external)
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 LLVM_IAS=1 \
            LD=ld.lld-12 AR=llvm-ar-12 NM=aarch64-linux-gnu-nm STRIP=llvm-strip-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 READELF=llvm-readelf-12 \
            -j1 M=bfkrt_ko modules > build_mod.log 2>&1
          RC=$?
          echo "MOD_RC=$RC"
          tail -40 build_mod.log
          ls -la bfkrt_ko/*.ko 2>&1 || true
          if [ ! -f bfkrt_ko/berryfetcher_kernel.ko ]; then echo "FATAL: no module"; exit 1; fi

      - name: Upload kernel + modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.4.210-sigoff
          path: |
            arch/arm64/boot/Image
            bfkrt_ko/*.ko
            System.map
            Module.symvers
          if-no-files-found: error
